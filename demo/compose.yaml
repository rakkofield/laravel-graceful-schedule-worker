services:
  moto:
    image: motoserver/moto:5.1.20
    environment:
      - MOTO_PORT=5000
      - MOTO_ACCOUNT_ID=000000000000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/moto-api/"]
      interval: 10s
      timeout: 5s
      retries: 5

  php:
    build:
      dockerfile: Dockerfile
      context: .
      additional_contexts:
        package: ../
    command: php artisan schedule:graceful-work
    depends_on:
      moto:
        condition: service_healthy
    environment:
      - SFN_ENDPOINT=http://moto:5000
      - AWS_SUPPRESS_PHP_DEPRECATION_WARNING=true
