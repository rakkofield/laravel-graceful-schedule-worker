x-php-build: &build
  build:
    dockerfile: Dockerfile
    context: .
    additional_contexts:
      package: ../

services:
  moto:
    image: motoserver/moto:5.1.20
    environment:
      - MOTO_PORT=5000
      - MOTO_ACCOUNT_ID=000000000000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/moto-api/"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  php:
    <<: *build
    command: php artisan schedule:graceful-work
    depends_on:
      moto:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SFN_ENDPOINT=http://moto:5000
      - AWS_SUPPRESS_PHP_DEPRECATION_WARNING=true
      - REDIS_HOST=redis
      - SCHEDULE_TRACKER_ENABLED=true
      - SCHEDULE_TRACKER_STORE=redis

  graceful:
    <<: *build
    command: php artisan schedule:graceful-work
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - SCHEDULE_TRACKER_ENABLED=true
      - SCHEDULE_TRACKER_STORE=redis
      - AWS_SUPPRESS_PHP_DEPRECATION_WARNING=true
    profiles: [compare]

  cron:
    <<: *build
    command: >
      /bin/sh -c "
        sleep $$(( 60 - $$(date +%%S) ));
        while true; do
          php artisan schedule:run --no-ansi --no-interaction 2>&1;
          sleep $$(( 60 - $$(date +%%S) ));
        done
      "
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - AWS_SUPPRESS_PHP_DEPRECATION_WARNING=true
    profiles: [compare]
