name: Step Functions Integration Tests

on:
  pull_request:
    paths:
      - 'src/Dispatcher/StepFunctions/**'
      - 'src/Dispatcher/StepFunctionsDispatcher.php'
      - 'src/Dispatcher/StepFunctionsDispatchResult.php'
      - 'tests/Integration/Dispatcher/**'
      - 'tests/StepFunctions/**'
      - 'docker-compose.stepfunctions.yml'
      - '.github/workflows/stepfunctions-test.yml'

jobs:
  stepfunctions-test:
    runs-on: ubuntu-latest

    services:
      moto:
        image: motoserver/moto:latest
        ports:
          - 5001:5000
        env:
          MOTO_PORT: 5000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: dom, curl, libxml, mbstring, zip, pcntl
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Install AWS SDK
        run: composer require aws/aws-sdk-php --dev --no-interaction

      - name: Wait for moto
        run: |
          timeout 60 bash -c 'until curl -s http://localhost:5001/moto-api/ > /dev/null; do sleep 2; done'

      - name: Run Integration Tests
        run: ./vendor/bin/phpunit --group=stepfunctions --testdox
        env:
          SFN_ENDPOINT: http://localhost:5001
