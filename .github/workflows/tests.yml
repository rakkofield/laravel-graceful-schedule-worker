name: tests

on:
    push:
        branches:
            - '*.x'
    pull_request:

jobs:
    linux_tests:
        runs-on: ubuntu-24.04

        services:
          moto:
            image: motoserver/moto:5.1.20
            ports:
              - 5001:5000
            env:
              MOTO_PORT: 5000
              MOTO_ACCOUNT_ID: "000000000000"
            options: >-
              --health-cmd "curl -f http://localhost:5000/moto-api/ || exit 1"
              --health-interval 5s
              --health-timeout 5s
              --health-retries 10
          redis:
            image: redis:7-alpine
            ports:
              - 6379:6379
            options: >-
              --health-cmd "redis-cli ping"
              --health-interval 5s
              --health-timeout 5s
              --health-retries 10

        strategy:
            fail-fast: false
            matrix:
                # Each Laravel version is tested on the lowest and highest PHP version it
                # supports. "phpunit" defaults to 9.6; PHP 7.2 uses 8.5, because
                # PHPUnit 9.6 requires PHP 7.3+.
                # "laravel" is the lower bound passed to composer as ^<laravel>.
                # With prefer-lowest, composer picks the lowest release that allows
                # the job's PHP; the bound is raised only where that release still
                # does not run on it (e.g. Laravel 8 on PHP 8.1).
                # "redis: true" also runs the Redis E2E test (prefer-stable only).
                # "skeleton" is the application the E2E tests run against
                # (default: skeleton, which has the Laravel 10 and earlier structure).
                target:
                    - { php: '7.2', laravel: '6.18.7', phpunit: '8.5.40' }
                    - { php: '8.0', laravel: '6.18.7', redis: true }
                    - { php: '7.2', laravel: '7.6.0', phpunit: '8.5.40' }
                    - { php: '8.0', laravel: '7.6.0', redis: true }
                    - { php: '7.3', laravel: '8.0' }
                    - { php: '8.1', laravel: '8.65.0', redis: true }
                    - { php: '8.0', laravel: '9.0' }
                    - { php: '8.2', laravel: '9.45.0', redis: true }
                    - { php: '8.1', laravel: '10.0' }
                    - { php: '8.3', laravel: '10.0', redis: true }
                    - { php: '8.2', laravel: '11.0', skeleton: skeleton-l11 }
                    - { php: '8.4', laravel: '11.0', skeleton: skeleton-l11, redis: true }
                    - { php: '8.2', laravel: '12.0', skeleton: skeleton-l11 }
                    - { php: '8.5', laravel: '12.0', skeleton: skeleton-l11, redis: true }
                stability: [prefer-lowest, prefer-stable]
        name: PHP ${{ matrix.target.php }} - Laravel ${{ matrix.target.laravel }} - PHPUnit ${{ matrix.target.phpunit || '9.6.21' }} - ${{ matrix.stability }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.target.php }}
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, gd, igbinary, msgpack, lzf, zstd, lz4, gmp, redis, :php-psr
                  ini-values: error_reporting=E_ALL
                  tools: composer:v2
                  coverage: none

            - name: Get composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache dependencies
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-${{ matrix.target.php }}-${{ matrix.target.laravel }}-${{ matrix.target.phpunit || '9.6.21' }}-${{ matrix.stability }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: ${{ runner.os }}-${{ matrix.target.php }}-${{ matrix.target.laravel }}-${{ matrix.target.phpunit || '9.6.21' }}-${{ matrix.stability }}-composer-

            - name: Set laravel/framework and phpunit/phpunit version constraints
              run: composer require --dev laravel/framework:^${{ matrix.target.laravel }} phpunit/phpunit:^${{ matrix.target.phpunit || '9.6.21' }} --no-interaction --no-update

            - name: Install dependencies for test
              run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

            - name: Set skeleton laravel
              working-directory: ${{ matrix.target.skeleton || 'skeleton' }}
              run: composer require laravel/framework:^${{ matrix.target.laravel }} --no-interaction --no-update

            - name: Install dependencies for skeleton
              working-directory: ${{ matrix.target.skeleton || 'skeleton' }}
              run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

            - name: Execute tests
              run: vendor/bin/phpunit
              env:
                  E2E_REDIS: ${{ matrix.target.redis && matrix.stability == 'prefer-stable' && '1' || '' }}
                  E2E_SKELETON_PATH: ${{ github.workspace }}/${{ matrix.target.skeleton || 'skeleton' }}
