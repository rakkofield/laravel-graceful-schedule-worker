version: '3.9'

services:
  localstack:
    container_name: localstack-stepfunctions
    image: localstack/localstack:3.0
    ports:
      - "4566:4566"
    environment:
      - SERVICES=stepfunctions
      - DEBUG=1
      - DEFAULT_REGION=ap-northeast-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    volumes:
      - "./tests/LocalStack/state-machine.json:/etc/localstack/init/ready.d/state-machine.json"
      - "./tests/LocalStack/init-stepfunctions.sh:/etc/localstack/init/ready.d/init-stepfunctions.sh"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
